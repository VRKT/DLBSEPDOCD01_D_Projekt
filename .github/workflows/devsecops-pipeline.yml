name: DevSecOps CI/CD Workflow for snowball-finance

on:
  push:
    branches: [ "master", "main" ]

# Erforderlich für AWS OIDC (Temporäre IAM-Rolle statt statischer Keys - Kapitel 3.5)
permissions:
  id-token: write
  contents: read

jobs:
  ###########################################
  # JOB 1: SCA (Software Composition Analysis)
  ###########################################
  security-sca:
    name: Snyk SCA Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

  ###########################################
  # JOB 2: SAST (Static Code Analysis)
  ###########################################
  security-sast:
    name: SonarCloud SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig für SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ###########################################
  # JOB 3: BUILD & DAST (Dynamic Analysis)
  ###########################################
  build-and-dast:
    name: Build & DAST
    runs-on: ubuntu-latest
    needs: [security-sca, security-sast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t snowball-finance:latest .

      - name: Start Container for DAST
        run: |
          docker run -d -p 5000:5000 --name snowball-app snowball-finance:latest
          sleep 10 # Warten, bis Flask hochgefahren ist
          
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:5000/u'
          fail_action: false

  ###########################################
  # JOB 4: DEPLOY TO AWS ECS
  ###########################################
  deploy-aws:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build-and-dast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS Login via OIDC (Wie in Kapitel 3.5 "Least Privilege" beschrieben)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsECRDeployRole
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: snowball-finance-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Simulating push to ECR for case study..."

      - name: Update ECS Service
        run: |
          # aws ecs update-service --cluster snowball-cluster --service snowball-service --force-new-deployment
          echo "Simulating ECS service update behind ALB..."
